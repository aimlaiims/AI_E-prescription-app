# Alembic: database schema migrations. The app applies them itself at startup
# (app/migrations.py); run these commands only when CHANGING the schema:
#
#   cd backend
#   alembic revision --autogenerate -m "what changed"   # then READ the new file
#   alembic upgrade head
#
# The database is DATABASE_URL from .env (see alembic/env.py), not a URL here.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
